name: Deploy to GitHub Pages

on:
  push:
    branches: ["claude/tender-noether-iuf79q", "main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Build site folder
        run: |
          mkdir _site
          cp index.html manifest.webmanifest sw.js _site/
          cp -r icons _site/
          # Give every deploy its own offline-cache version so installed copies update.
          sed -i "s/^const VERSION = '.*';/const VERSION = 'survey-${GITHUB_SHA::8}';/" _site/sw.js
          grep "^const VERSION" _site/sw.js

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
